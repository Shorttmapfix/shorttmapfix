<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner — Shortt map / Fix</title>
  <meta name="description" content="Glisse ton dossier resources FiveM et récupère la liste des conflits, doublons et fichiers chiffrés.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-title="title.scanner">
  <div class="glow glow-1"></div>

  <div class="nav-wrap">
    <header class="nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="" width="30" height="30">
        <span>Shortt map <em>/ Fix</em></span>
      </a>
      <nav class="nav-links">
        <a class="nav-item" id="discordLink" href="#" target="_blank" rel="noopener">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.1.246.198.373.292a.077.077 0 0 1-.007.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03ZM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
          <span class="hide-sm" data-i18n="nav.community">Communauté</span>
        </a>
        <button class="nav-item" id="langBtn" type="button">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></svg>
          <span id="langLabel">FR</span>
        </button>
        <a class="btn btn-small" href="scanner.html"><span data-i18n="nav.open">Ouvrir le scanner</span> <span class="arrow">↗</span></a>
      </nav>
    </header>
  </div>

  <main>
    <section class="page-head">
      <div class="page-head-row">
        <h1 data-i18n="sc.title">Scanner</h1>
        <button class="btn btn-ghost btn-small" id="tourBtn" type="button" data-i18n="sc.tour">Tutoriel</button>
      </div>
      <p data-i18n="sc.text">Tout est analysé dans ton navigateur : aucun fichier n'est envoyé.</p>
    </section>

    <section id="scanner" class="card">
      <label id="drop" class="drop">
        <input id="picker" type="file" webkitdirectory directory multiple hidden>
        <div class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 11v5m0-5-2 2m2-2 2 2"/></svg></div>
        <strong data-i18n="sc.drop">Glisse ton dossier <code>resources</code> ici</strong>
        <span data-i18n="sc.dropOr">ou clique pour le choisir</span>
      </label>
      <div class="import-row">
        <label class="import-btn">
          <input id="importPicker" type="file" accept=".html,.htm" hidden>
          <span data-i18n="sc.import">Rouvrir un récap .html</span>
        </label>
        <span data-i18n="sc.importOr">ou glisse-le dans la zone au-dessus</span>
      </div>

      <div id="progress" class="progress" hidden>
        <div class="bar"><i id="bar"></i></div>
        <span id="progressText"></span>
      </div>
    </section>

    <section id="results" hidden>
      <div class="stats" id="stats"></div>

      <div class="card toolbar">
        <div class="field">
          <label id="targetLabel" data-i18n="sc.target">Ressource ciblée</label>
          <div class="select" id="target">
            <button class="select-btn" type="button" aria-haspopup="listbox" aria-labelledby="targetLabel">
              <span class="select-label"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="select-pop" hidden>
              <input class="select-search" type="text" placeholder="Rechercher une ressource…" data-i18n-ph="sc.search" autocomplete="off" spellcheck="false">
              <ul class="select-list" role="listbox" aria-multiselectable="true" aria-labelledby="targetLabel"></ul>
              <div class="select-foot">
                <span data-i18n="sc.multi"><kbd>Ctrl</kbd> / <kbd>Shift</kbd> + clic pour en choisir plusieurs</span>
                <span><span class="select-n"></span> <button class="select-clear" type="button" hidden data-i18n="sc.clear">Tout effacer</button></span>
              </div>
            </div>
          </div>
        </div>
        <div class="field field-rate">
          <label for="rate" data-i18n="sc.rate">Tarif / conflit (€)</label>
          <input id="rate" class="input" type="number" min="0" step="0.5" value="10" inputmode="decimal">
          <small id="rateTotal" class="rate-total"></small>
        </div>
        <div class="actions">
          <button class="btn" id="exportHtml" data-i18n="sc.export">Télécharger le récap</button>
        </div>
      </div>

      <div id="report"></div>
    </section>
  </main>

  <footer>
    <span>© Shortt map / Fix</span>
    <span data-i18n="foot.disclaimer">Non affilié à Rockstar Games, Take-Two ou Cfx.re.</span>
  </footer>

  <script src="assets/site.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
